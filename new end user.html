document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ick=\"{{ resume.open }}\" style=\"height:36px;padding:0 14px;border:1px solid #efece7;border-radius:10px;background:#fff;color:#1a1917;font:500 12.5px/1 Poppins,sans-serif;cursor:pointer\" style-hover=\"background:#f9f7f4\">Retake a practice test<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <sc-for list=\"{{ upNext }}\" as=\"u\" hint-placeholder-count=\"3\">\n                  <div sc-camel-on-click=\"{{ u.open }}\" role=\"button\" sc-camel-tab-index=\"0\" style=\"display:flex;align-items:center;gap:12px;border:1px solid #efece7;border-radius:11px;padding:11px 14px;cursor:pointer\" style-hover=\"background:#f9f7f4;border-color:#e2ded7\">\n                    <span style=\"font:500 11.5px/1 'IBM Plex Mono',monospace;color:#6a655c\">{{ u.n }}<\u002Fspan>\n                    <span style=\"flex:1;min-width:0\">\n                      <span style=\"display:block;font:500 12.5px/1.35 Poppins,sans-serif;color:#1a1917\">{{ u.label }}<\u002Fspan>\n                      <span style=\"display:block;margin-top:4px;font:400 11.5px/1.3 'IBM Plex Mono',monospace;color:#6a655c\">{{ u.meta }}<\u002Fspan>\n                    <\u002Fspan>\n                    <span aria-hidden=\"true\" style=\"color:#6a655c;font:400 14px/1 Poppins,sans-serif\">→<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ showCards }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;align-items:start\">\n            <sc-for list=\"{{ visibleCourses }}\" as=\"c\" hint-placeholder-count=\"6\">\n              <article sc-camel-on-click=\"{{ c.open }}\" role=\"button\" sc-camel-tab-index=\"0\" sc-camel-on-key-down=\"{{ c.keyOpen }}\" aria-label=\"{{ c.openLabel }}\" style=\"background:#fff;border:1px solid #efece7;border-radius:14px;box-shadow:0 1px 3px rgba(26,25,23,.08);overflow:hidden;display:flex;flex-direction:column;cursor:pointer\" style-hover=\"box-shadow:0 10px 24px rgba(26,25,23,.13);border-color:#e2ded7\">\n                <div style=\"position:relative;height:124px;display:flex;align-items:flex-end;padding:12px 14px;background:{{ c.grad }}\">\n                  <svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"position:absolute;right:-10px;top:-14px;width:132px;height:132px;opacity:.26\"><path d=\"{{ c.icon }}\"><\u002Fpath><\u002Fsvg>\n                  <span style=\"position:absolute;top:12px;left:14px;display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.94);font:600 11.5px/1 Poppins,sans-serif;color:{{ c.statusFg }}\">{{ c.status }}<\u002Fspan>\n                  <span style=\"display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:rgba(26,25,23,.28);color:#fff;font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.06em\">{{ c.cat }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"padding:16px;display:flex;flex-direction:column;gap:10px;flex:1\">\n                  <h3 style=\"margin:0;font:600 15px/1.3 Poppins,sans-serif;color:#1a1917\">{{ c.title }}<\u002Fh3>\n                  <div style=\"font:400 12px/1 'IBM Plex Mono',monospace;color:#6a655c\">{{ c.meta }}<\u002Fdiv>\n                  <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                    <sc-for list=\"{{ c.types }}\" as=\"t\" hint-placeholder-count=\"3\">\n                      <span style=\"display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;border:1px solid #efece7;background:#f9f7f4;font:500 11.5px/1 Poppins,sans-serif;color:#4e4a43\">{{ t } bar }}\">{{ c.progress }}%<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font:400 11.5px/1 'IBM Plex Mono',monospace;color:#6a655c\">{{ c.when }}<\u002Fspan>\n                <button type=\"button\" sc-camel-on-click=\"{{ c.open }}\" style=\"justify-self:end;height:34px;padding:0 14px;border:1px solid #efece7;border-radius:9px;background:#fff;color:#1a1917;font:500 12.5px/1 Poppins,sans-serif;cursor:pointer\" style-hover=\"background:#f9f7f4\">{{ c.cta }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ showSandboxes }}\" hint-placeholder-val=\"{{ true }}\">\n          <section ref=\"{{ sandboxRef }}\" aria-label=\"Sandboxes\" style=\"margin-top:10px;padding-top:22px;border-top:1px solid #efece7;display:flex;flex-direction:column;gap:16px\">\n            <div>\n              <h2 style=\"margin:0;font:600 18px/1.2 Poppins,sans-serif;color:#1a1917\">Sandboxes<\u002Fh2>\n              <p style=\"margin:6px 0 0;font:400 13px/1.45 Poppins,sans-serif;color:#4e4a43\">Pick a duration and start a live environment. Time counts against your monthly allocation.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;align-items:start\">\n              <sc-for list=\"{{ sandboxes }}\" as=\"s\" hint-placeholder-count=\"3\">\n                <article style=\"position:relative;background:#fff;border:1px solid #efece7;border-radius:14px;box-shadow:0 1px 3px rgba(26,25,23,.08);padding:18px;display:flex;flex-direction:column;gap:12px\">\n                  <sc-if value=\"{{ s.highlight }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span aria-hidden=\"true\" style=\"position:absolute;inset:-3px;border-radius:17px;border:2px solid #f0602a;pointer-events:none\"><\u002Fspan>\n                  <\u002Fsc-if>\n                  <div style=\"display:flex;align-items:cen =\"button\" sc-camel-on-click=\"{{ cr.copy }}\" aria-label=\"{{ cr.copyLabel }}\" style=\"width:36px;flex:none;border:none;border-left:1px solid #efece7;background:#f9f7f4;color:#4e4a43;display:flex;align-items:center;justify-content:center;cursor:pointer\" style-hover=\"background:#fff5f0;color:#b23b17\">\n                                  <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"9\" width=\"11\" height=\"11\" rx=\"2\"><\u002Frect><path d=\"M5 15V6a2 2 0 0 1 2-2h8\"><\u002Fpath><\u002Fsvg>\n                                <\u002Fbutton>\n                              <\u002Fdiv>\n                            <\u002Fdiv>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Farticle>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ showWorkspaces }}\" hint-placeholder-val=\"{{ false }}\">\n          <section aria-label=\"Workspaces\" style=\"display:flex;flex-direction:column;gap:16px\">\n            <div>\n              <h2 style=\"margin:0;font:600 18px/1.2 Poppins,sans-serif;color:#1a1917\">Workspaces<\u002Fh2>\n              <p style=\"margin:6px 0 0;font:400 13px/1.45 Poppins,sans-serif;color:#4e4a43\">Persistent development environments. Your files and installed tools stay between sessions.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid #efece7;border-radius:14px;box-shadow:0 1px 3px rgba(26,25,23,.08);overflow:hidden\">\n              <sc-for list=\"{{ workspaces }}\" as=\"w\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:center;gap:14px;padding:16px 20px;border-top:1px solid pins,sans-serif;color:#1a1917\">Custom sandboxes<\u002Fh2>\n              <p style=\"margin:6px 0 0;font:400 13px/1.45 Poppins,sans-serif;color:#4e4a43\">Environments configured for your organisation. Create one to get scoped credentials.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid #efece7;border-radius:14px;box-shadow:0 1px 3px rgba(26,25,23,.08);overflow:hidden\">\n              <sc-for list=\"{{ customSandboxes }}\" as=\"c\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex;align-items:center;gap:14px;padding:16px 20px;border-top:1px solid #f3f0eb;flex-wrap:wrap\">\n                  <span aria-hidden=\"true\" style=\"width:40px;height:40px;flex:none;border-radius:11px;background:#f2ecfd;display:flex;align-items:center;justify-content:center\">\n                    <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6d28d9\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 5h16v11H4zM8 20h8M9 9l2.5 2L9 13\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fspan>\n                  <div style=\"flex:1 1 260px;min-width:0\">\n                    <div style=\"font:600 14.5px/1.3 Poppins,sans-serif;color:#1a1917\">{{ c.name }}<\u002Fdiv>\n                    <div style=\"margin-top:4px;font:400 11.5px/1.4 'IBM Plex Mono',monospace;color:#6a655c\">{{ c.region }} · {{ c.window }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;border:1px solid #efece7;background:#f9f7f4;font:500 11px/1 'IBM Plex Mono',monospace;color:#4e4a43\">{{ c.cat }}<\u002Fspan>\n                  <button type=\"button\" sc-camel-on-click=\"{{ c.create }}\" style=\"height:38px;padding:0 18px;border:none;border-radius:10px;background:linear-gradient(135deg,#e8402b 0%,#f0602a 52%,#f78b20 100%);color:#fff;font:600 13px/1 Poppins,sans-serif;cursor:pointer\">Create sandbox<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ showVms }}\" hint-placeholder-val=\"{{ false }}\">\n          <section aria-label=\"Virtual machines\" style=\"display:flex;flex-direction:column;gap:16px\">\n            <div>\n              <h2 style=\"margin:0;font:600 18px/1.2 Poppins,sans-serif;color:#1a1917\">Virtual machines<\u002Fh2>\n              <p style=\"margin:6px 0 0;font:400 13px/1.45 Poppins,sans-serif;color:#4e4a43\">Pre-built machines you can open in the browser. No local install required.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border:1px solid #efece7;border-radius:14px;box-shadow:0 1px 3px rgba(26,25,23,.08);overflow:hidden\">\n              <sc-for list=\"{{ vms }}\" as=\"v\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;align-items:center;gap:14px;padding:16px 20px;border-top:1px solid #f3f0eb;flex-wrap:wrap\">\n                  <span aria-hidden=\"true\" style=\"width:40px;height:40px;flex:none;border-radius:11px;background:#eef8f2;display:flex;align-items:center;justify-content:center\">\n                    <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0b7a3c\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"12\" rx=\"2\"><\u002Frect><path d=\"M8 21h8M12 17v4\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fspan>\n                  <div style=\"flex:1 1 260px;min-width:0\">\n                    <div style=\"font:600 14.5px/1.3 Poppins,sans-serif;color:#1a1917\">{{ v.name }}<\u002Fdiv>\n                    <div style=\"margin-top:4px;font:400 11.5px/1.4 'IBM Plex Mono',monospace;color:#6a655c\">{{ v.spec }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"font:400 12px/1 'IBM Plex Mono',monospace;color:#6a655c\">{{ v.note }}<\u002Fspan>\n                  <span style=\"display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font:600 11px/1 Poppins,sans-serif;background:{{ v.stateBg }};color:{{ v.stateFg }}\">{{ v.state }}<\u002Fspan>\n                  <button type=\"button\" sc-camel-on-click=\"{{ v.action }}\" style=\"height:38px;padding:0 18px;border:none;border-radius:10px;background:linear-gradient(135deg,#e8402b 0%,#f0602a 52%,#f78b20 100%);color:#fff;font:600 13px/1 Poppins,sans-serif;cursor:pointer\">{{ v.cta }}<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isPaths }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:18px\">\n          <sc-if value=\"{{ pathListing }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:18px\">\n            <div>\n              <h1 style=\"margin:0;font:600 24px/1.2 Poppins,sans-serif;color:#1a1917;letter-spacing:-.02em\">Learning paths<\u002Fh1>\n              <p style=\"margin:8px 0 0;font:400 13.5px/1.4 Poppins,sans-serif;color:#4e4a43\">Curated sequences assigned to you. Open a path to see the courses it contains.<\u002Fp>\n            <\u002Fdiv>\n\n            <form sc-camel-on-submit=\"{{ noop }}\" style=\"position:relative;max-width:360px\">\n              <label for=\"path-search\" style=\"position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)\">Search learning paths<\u002Flabel>\n              <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6a655c\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"position:absolute;left:14px;top:13px\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m20 20-3.2-3.2\"><\u002Fpath><\u002Fsvg>\n              <input id=\"path-search\" type=\"search\" sc-camel-auto-complete=\"off\" placeholder=\"Search learning paths\" value=\"{{ pathQuery }}\" sc-camel-on-change=\"{{ onPathQuery }}\" style=\"width:100%;height:44px;box-sizing:border-box;padding:0 14px 0 42px;border:1px solid #efece7;border-radius:11px;background:#fff;font:400 13.5px/1 Poppins,sans-serif;color:#1a1917;outline:none\">\n            <\u002Fform>\n\n            <sc-if value=\"{{ hasPaths }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background:#fff;border:1px solid #efece7;border-radius:14px;box-shadow:0 1px 3px rgba(26,25,23,.08);overflow-x:auto\">\n              <div style=\"min-width:860px;display:grid;grid-template-columns:minmax(0,2.4fr) 90px 120px 120px minmax(0,1.3fr) 110px;gap:16px;padding:12px 20px;background:#f9f7f4;border-bottom:1px solid #efece7;font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;color:#6a655c;text-transform:uppercase\">\n                <span>Learning path<\u002Fspan><span>Courses<\u002Fspan><span>Created<\u002Fspan><span>End date<\u002Fspan><span>Progress<\u002Fspan><span><\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ pathRows }}\" as=\"p\" hint-placeholder-count=\"3\">\n                <div sc-camel-on-click=\"{{ p.open }}\" role=\"button\" sc-camel-tab-index=\"0\" sc-camel-on-key-down=\"{{ p.keyOpen }}\" aria-label=\"{{ p.openLabel }}\" style=\"min-width:860px;display:grid;grid-template-columns:minmax(0,2.4fr) 90px 120px 120px minmax(0,1.3fr) 110px;gap:16px;align-items:center;padding:14px 20px;border-bottom:1px solid #f3f0eb;cursor:pointer\" style-hover=\"background:#f9f7f4\">\n                  <div style=\"display:flex;align-items:center;gap:12px;min-width:0\">\n                    <span aria-hidden=\"true\" style=\"width:38px;height:38px;flex:none;border-radius:11px;background:#f2ecfd;display:flex;align-items:center;justify-content:center\">\n                      <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6d28d9\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"6\" cy=\"6\" r=\"2.5\"><\u002Fcircle><circle cx=\"18\" cy=\"18\" r=\"2.5\"><\u002Fcircle><path d=\"M8.5 6H14a4 4 0 0 1 0 8h-4a4 4 0 0 0 0 8h5.5\"><\u002Fpath><\u002Fsvg>\n                    <\u002Fspan>\n                    <div style=\"min-width:0\">\n                      <div style=\"font:600 14.5px/1.3 Poppins,sans-serif;color:#1a1917\">{{ p.name }}<\u002Fdiv>\n                      <div style=\"margin-top:3px;font:400 11.5px/1.4 Poppins,sans-serif;color:#6a655c\">{{ p.blurb }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"font:500 12.5px/1 'IBM Plex Mono',monospace;color:#4e4a43\">{{ p.courseCount }}<\u002Fspan>\n                  <span style=\"font:400 12px/1 'IBM Plex Mono',monospace;color:#6a655c\">{{ p.created }}<\u002Fspan>\n                  <span style=\"font:400 12px/1 'IBM Plex Mono',monospace;color:#6a655c\">{{ p.endDate }}<\u002Fspan>\n                  <div style=\"display:flex;align-items:center;gap:10px;min-width:0\">\n                    <div style=\"flex:1;height:8px;border-radius:999px;background:#efece7;overflow:hidden\"><div style=\"width:{{ p.progress }}%;height:100%;border-radius:999px;background:{{ p.bar }}\"><\u002Fdiv><\u002Fdiv>\n                    <span style=\"font:600 12.5px/1 'IBM Plex Mono',monospace;color:{{ p.bar }}\">{{ p.progress }}%<\u002Fspan>\n                  <\u002Fdiv>\n                  <button type=\"button\" sc-camel-on-click=\"{{ p.open }}\" style=\"height:36px;border:1px solid #efece7;border-radius:9px;background:#fff;color:#1a1917;font:500 12.5px/1 Poppins,sans-serif;cursor:pointer\" style-hover=\"background:#fff5f0;border-color:#fca781;color:#b23b17\">View<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n 7 7 7 7\"><\u002Fpath><\u002Fsvg>\n              All learning paths\n            <\u002Fbutton>\n\n            <div style=\"background:#fff;border:1px solid #efece7;border-radius:14px;box-shadow:0 1px 3px rgba(26,25,23,.08);padding:22px;display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start\">\n              <span aria-hidden=\"true\" style=\"width:56px;height:56px;flex:none;border-radius:14px;background:#f2ecfd;display:flex;align-items:center;justify-content:center\">\n                <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6d28d9\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"6\" cy=\"6\" r=\"2.5\"><\u002Fcircle><circle cx=\"18\" cy=\"18\" r=\"2.5\"><\u002Fcircle><path d=\"M8.5 6H14a4 4 0 0 1 0 8h-4a4 4 0 0 0 0 8h5.5\"><\u002Fpath><\u002Fsvg>\n              <\u002Fspan>\n              <div style=\"flex:1 1 320px;min-width:0\">\n                <h1 style=\"margin:0;font:600 22px/1.25 Poppins,sans-serif;color:#1a1917;letter-spacing:-.01em\">{{ activePath.name }}<\u002Fh1>\n                <p style=\"margin:8px 0 0;max-width:68ch;font:400 13.5px/1.6 Poppins,sans-serif;color:#4e4a43;text-wrap:pretty\">{{ activePath.overview }}<\u002Fp>\n                <div style=\"margin-top:12px;display:flex;flex-wrap:wrap;gap:18px;font:400 12px/1 'IBM Plex Mono',monospace;color:#6a655c\">\n                  <span>{{ activePath.courseCount }} courses<\u002Fspan>\n                  <span>Created {{ activePath.created }}<\u002Fspan>\n                  <span>Ends {{ activePath.endDate }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:0 1 240px;min-width:200px\">\n                <div style=\"height:10px;border-radius:999px;background:#efece7;overflow:hidden\"><div style=\"width:{{ activePath.progress }}%;height:100%;border-radius:999px;background:{{ activePath.bar }}\"><\u002Fdiv><\u002Fdiv>\n                <div style=\"margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:12px\">\n                  <span style=\"font:600 14px/1 Poppins,sans-serif;color:{{ activePath.bar }}\">{{ activePath.progress }}% complete<\u002Fspan>\n                  <span style=\"font:400 12px/1 'IBM Plex Mono',monospace;color:#6a655c\">{{ activePath.doneLabel }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;align-items:start\">\n              <sc-for list=\"{{ pathCourses }}\" as=\"c\" hint-placeholder-count=\"3\">\n                <article sc-camel-on-click=\"{{ c.open }}\" role=\"button\" sc-camel-tab-index=\"0\" sc-camel-on-key-down=\"{{ c.keyOpen }}\" aria-label=\"{{ c.openLabel }}\" style=\"position:relative;background:#fff;border:1px solid #efece7;border-radius:14px;box-shadow:0 1px 3px rgba(26,25,23,.08);overflow:hidden;display:flex;flex-direction:column;cursor:pointer\" style-hover=\"box-shadow:0 10px 24px rgba(26,25,23,.13);border-color:#e2ded7\">\n                  <div style=\"position:relative;height:124px;display:flex;align-items:flex-end;padding:12px 14px;background:{{ c.grad }}\">\n                    <svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"position:absolute;right:-10px;top:-14px;width:132px;height:132px;opacity:.26\"><path d=\"{{ c.icon }}\"><\u002Fpath><\u002Fsvg>\n                    <span style=\"position:absolute;top:12px;left:14px;display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.94);font:600 11.5px/1 Poppins,sans-serif;color:{{ c.statusFg }}\">{{ c.status }}<\u002Fspan>\n                    <span style=\"position:absolute;top:12px;right:14px;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:999px;background:rgba(26,25,23,.34);color:#fff;font:600 12px/1 'IBM Plex Mono',monospace\">{{ c.step }}<\u002Fspan>\n                    <span style=\"display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:rgba(26,25,23,.28);color:#fff;font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.06em\">{{ c.cat }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"padding:16px;display:flex;flex-direction:column;gap:10px;flex:1\">\n                    <h3 style=\"margin:0;font:600 15px/1.3 Poppins,sans-serif;color:#1a1917\">{{ c.title }}<\u002Fh3>\n                    <div style=\"font:400 12px/1 'IBM Plex Mono',monospace;color:#6a655c\">{{ c.meta }}<\u002Fdiv>\n                    <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                      <sc-for list=\"{{ c.types }}\" as=\"t\" hint-placeholder-count=\"3\">\n                        <span style=\"display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;border:1px solid #efece7;background:#f9f7f4;font:500 11.5px/1 Poppins,sans-serif;color:#4e4a43\">{{ t }}<\u002Fspan>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                    <div style=\"margin-top:auto;display:flex;align-items:center;gap:10px\">\n                      <div style=\"flex:1;height:8px;border-radius:999px;background:#efece7;overflow:hidden\"><div style=\"width:{{ c.progress }}%;height:100%;border-radius:999px;background:{{ c.bar }}\"><\u002Fdiv><\u002Fdiv>\n                      <span style=\"font:600 12.5px/1 'IBM Plex Mono',monospace;color:{{ c.bar }}\">{{ c.progress }}%<\u002Fspan>\n                    <\u002Fdiv>\n                    <button type=\"button\" sc-camel-on-click=\"{{ c.open }}\" style=\"margin-top:4px;height:40px;border:1px solid #efece7;border-radius:10px;background:#fff;color:#1a1917;font:500 13.5px/1 Poppins,sans-serif;cursor:pointer\" style-hover=\"background:#f9f7f4\"> 600 15.5px/1.3 Poppins,sans-serif;color:#1a1917\">{{ e.title }}<\u002Fh2>\n                  <p style=\"margin:8px 0 0;font:400 13px/1.55 Poppins,sans-serif;color:#4e4a43;text-wrap:pretty\">{{ e.body }}<\u002Fp>\n                <\u002Fdiv>\n                <button type=\"button\" sc-camel-on-click=\"{{ e.act }}\" style=\"margin-top:auto;height:38px;padding:0 18px;border:1px solid #efece7;border-radius:10px;background:#fff;color:#1a1917;font:500 13px/1 Poppins,sans-serif;cursor:pointer\" style-hover=\"background:#fff5f0;border-color:#fca781;color:#b23b17\">{{ e.cta }}<\u002Fbutton>\n                <span style=\"font:400 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#6a655c;text-transform:uppercase\">{{ e.where }}<\u002Fspan>\n              <\u002Farticle>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isResults }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:18px\">\n          <div>\n            <h1 style=\"margin:0;font:600 24px/1.2 Poppins,sans-serif;color:#1a1917;letter-spacing:-.02em\">{{ resultsTitle }} <span style=\"font-family:'IBM Plex Mono',monospace;font-size:18px;color:#6a655c\">{{ resultCount }}<\u002Fspan><\u002Fh1>\n            <p style=\"margin:8px 0 0;font:400 13.5px/1.4 Poppins,sans-serif;color:#4e4a43\">Ranked by relevance to your current trainings first, then by how recently you opened them.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start\">\n            <form sc-camel-on-submit=\"{{ noop }}\" style=\"flex:1 1 232px;max-width:280px;min-width:200px;box-sizing:border-box;background:#fff;border:1px solid #efece7;border-radius:14px;box-shadow:0 1px 3px rgba(26,25,23,.08);padding:20px\">\n              <span style=\"font:600 16px/1 Poppins,sans-serif;color:#1a1917\">Filter by<\u002Fspan>\n\n              <fieldset style=\"margin:20px 0 0;padding:0;border:none\">\n                <legend style=\"padding:0;font:600 13.5px/1 Poppins,sans-serif;color:#1a1917\">Course name<\u002Flegend>\n                <div style=\"position:relative;margin-top:13px\">\n                  <input type=\"text\" sc-camel-auto-complete=\"off\" aria-label=\"Filter by course name\" placeholder=\"Type a course name\" value=\"{{ cfQuery }}\" sc-camel-on-change=\"{{ onCfQuery }}\" style=\"width:100%;height:38px;box-sizing:border-box;padding:0 12px;border:1px solid #efece7;border-radius:9px;background:#fff;font:400 13px/1 Poppins,sans-serif;color:#1a1917;outline:none\">\n                  <sc-if value=\"{{ cfOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div role=\"listbox\" aria-label=\"Matching courses\" style=\"position:absolute;z-index:20;top:42px;left:0;width:100%;background:#fff;border:1px solid #efece7;border-radius:10px;box-shadow:0 14px 30px rgba(26,25,23,.18);overflow:hidden\">\n                      <sc-for list=\"{{ cfMatches }}\" as=\"m\" hint-placeholder-count=\"3\">\n                        <button type=\"button\" sc-camel-on-click=\"{{ m.pick }}\" style=\"width:100%;display:block;padding:9px 12px;border:none;border-top:1px solid #f3f0eb;background:#fff;text-align:left;cursor:pointer\" style-hover=\"background:#f9f7f4\">\n                          <span style=\"display:block;font:500 12.5px/1.35 Poppins,sans-serif;color:#1a1917\">{{ m.title }}<\u002Fspan>\n                          <span style=\"display:block;margin-top:3px;font:400 11px/1 'IBM Plex Mono',monospace;color:#6a655c\">{{ m.cat }}<\u002Fspan>\n                        <\u002Fbutton>\n                      <\u002Fsc-for>\n                      <sc-if value=\"{{ cfNoMatch }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"padding:11px 12px;font:400 12.5px/1 Poppins,sans-serif;color:#6a655c\">No course matches that name.<\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n
